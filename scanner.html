<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Door Scanner | Light & Shadow Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --gold:  #c9a227;
      --dark:  #0a0a0c;
      --dark2: #111116;
      --dark3: #1a1a1f;
      --text:  #f5f5f7;
      --muted: #888;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .screen.hidden { display: none; }

    /* ── PIN SCREEN ───────────────────────────────── */
    #pinScreen { background: var(--dark); gap: 20px; }

    .brand-name {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .pin-label {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
    }
    .pin-display {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      transition: background 0.15s;
    }
    .pin-dot.filled { background: var(--gold); }
    .pin-error {
      font-size: 0.8rem;
      color: #f87171;
      text-align: center;
      min-height: 20px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(4, 72px);
      gap: 12px;
    }
    .key {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 1.5px solid rgba(201,162,39,0.3);
      background: var(--dark3);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.1s;
    }
    .key:active { background: rgba(201,162,39,0.2); }
    .key.empty  { background: transparent; border: none; cursor: default; }
    .key.del    { font-size: 1rem; color: var(--muted); }

    /* ── SCANNER SCREEN ───────────────────────────── */
    #scanScreen {
      background: var(--dark);
      padding: 0;
      justify-content: flex-start;
    }

    .scan-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--dark2);
      border-bottom: 1px solid rgba(201,162,39,0.2);
      flex-shrink: 0;
      z-index: 10;
    }
    .scan-title {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: bold;
    }
    .lock-btn {
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
    }

    /* html5-qrcode renders into this div */
    #qr-reader {
      width: 100%;
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    /* Override html5-qrcode default styles to match our dark theme */
    #qr-reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    #qr-reader img { display: none !important; }
    #qr-reader__dashboard { display: none !important; }
    #qr-reader__status_span { display: none !important; }
    #qr-reader__camera_selection { display: none !important; }
    #qr-reader__filescan_input { display: none !important; }

    .scan-hint {
      width: 100%;
      text-align: center;
      padding: 12px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      background: var(--dark2);
      flex-shrink: 0;
    }

    /* ── RESULT OVERLAY ───────────────────────────── */
    #resultOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      display: none;
    }
    #resultOverlay.show { display: flex; }
    #resultOverlay.valid   { background: rgba(10,40,20,0.98); }
    #resultOverlay.invalid { background: rgba(40,10,10,0.98); }
    #resultOverlay.warning { background: rgba(40,35,5,0.98); }

    .result-icon    { font-size: 5rem; margin-bottom: 12px; line-height: 1; }
    .result-status  { font-size: 1.6rem; font-weight: bold; letter-spacing: 0.05em; margin-bottom: 8px; }
    .result-name    { font-size: 1.1rem; font-weight: bold; color: var(--text); margin-bottom: 4px; }
    .result-seat    { font-size: 2rem; font-weight: bold; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 16px; }
    .result-msg     { font-size: 0.9rem; color: rgba(255,255,255,0.7); max-width: 280px; line-height: 1.5; margin-bottom: 6px; }
    .result-my      { font-size: 0.85rem; color: rgba(255,255,255,0.45); max-width: 280px; line-height: 1.6; margin-bottom: 24px; }
    .result-timer   { font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-bottom: 20px; }
    .result-btn {
      padding: 14px 48px;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
    }
    .btn-green  { background: #4ade80; color: #000; }
    .btn-red    { background: #f87171; color: #000; }
    .btn-yellow { background: var(--gold); color: #000; }

    /* ── LOADING ──────────────────────────────────── */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(10,10,12,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(201,162,39,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pinScreen" class="screen">
  <div>
    <div class="brand-name">Light &amp; Shadow Media</div>
    <div class="brand-sub">Door Scanner — ဝင်ပေါက် စစ်ဆေးရေး</div>
  </div>

  <div class="pin-label">Staff PIN ထည့်ပါ</div>

  <div class="pin-display">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>

  <div class="pin-error" id="pinError"></div>

  <div class="keypad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key empty"></button>
    <button class="key" data-k="0">0</button>
    <button class="key del" id="delBtn">⌫</button>
  </div>
</div>


<!-- SCANNER SCREEN -->
<div id="scanScreen" class="screen hidden">
  <div class="scan-header">
    <div class="scan-title">🎬 Scan Ticket</div>
    <button class="lock-btn" id="lockBtn">Lock</button>
  </div>
  <div id="qr-reader"></div>
  <div class="scan-hint">Point camera at the QR code &nbsp;|&nbsp; QR Code ကို ကင်မရာဖြင့် ရိုက်ပါ</div>
</div>


<!-- LOADING -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:0.85rem;">Verifying ticket…</p>
</div>


<!-- RESULT OVERLAY -->
<div id="resultOverlay">
  <div class="result-icon"   id="rIcon"></div>
  <div class="result-status" id="rStatus"></div>
  <div class="result-name"   id="rName"></div>
  <div class="result-seat"   id="rSeat"></div>
  <div class="result-msg"    id="rMsg"></div>
  <div class="result-my"     id="rMy"></div>
  <div class="result-timer"  id="rTimer"></div>
  <button class="result-btn" id="rBtn">Scan Next</button>
</div>


<!-- html5-qrcode: best iOS Safari support available -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<script>
  const WORKER_URL = 'https://lsm-bookings.lightandshadowmdeiasg.workers.dev/scan';
  const PIN_LEN    = 4;

  let pin          = '';
  let staffPin     = '';
  let html5QrCode  = null;
  let processing   = false;
  let countdown    = null;

  // ── Elements ─────────────────────────────────────────────────
  const pinScreen      = document.getElementById('pinScreen');
  const scanScreen     = document.getElementById('scanScreen');
  const pinError       = document.getElementById('pinError');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const resultOverlay  = document.getElementById('resultOverlay');
  const rIcon          = document.getElementById('rIcon');
  const rStatus        = document.getElementById('rStatus');
  const rName          = document.getElementById('rName');
  const rSeat          = document.getElementById('rSeat');
  const rMsg           = document.getElementById('rMsg');
  const rMy            = document.getElementById('rMy');
  const rTimer         = document.getElementById('rTimer');
  const rBtn           = document.getElementById('rBtn');

  // ── PIN INPUT ─────────────────────────────────────────────────
  document.querySelectorAll('.key[data-k]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pin.length >= PIN_LEN) return;
      pin += btn.dataset.k;
      updateDots();
      if (pin.length === PIN_LEN) setTimeout(onPinComplete, 200);
    });
  });

  document.getElementById('delBtn').addEventListener('click', () => {
    pin = pin.slice(0, -1);
    updateDots();
    pinError.textContent = '';
  });

  function updateDots() {
    for (let i = 0; i < PIN_LEN; i++) {
      document.getElementById(`dot${i}`).classList.toggle('filled', i < pin.length);
    }
  }

  function onPinComplete() {
    staffPin = pin;
    pin = '';
    updateDots();
    pinError.textContent = '';
    showScanner();
  }

  // ── SCREENS ───────────────────────────────────────────────────
  function showScanner() {
    pinScreen.classList.add('hidden');
    scanScreen.classList.remove('hidden');
    startScanner();
  }

  function showPin(errorMsg) {
    stopScanner();
    scanScreen.classList.add('hidden');
    pinScreen.classList.remove('hidden');
    staffPin = '';
    pin = '';
    updateDots();
    if (errorMsg) setTimeout(() => { pinError.textContent = errorMsg; }, 300);
  }

  document.getElementById('lockBtn').addEventListener('click', () => showPin(''));

  // ── QR SCANNER (html5-qrcode — best iOS Safari support) ───────
  function startScanner() {
    const config = {
      fps:            10,
      qrbox:          { width: 250, height: 250 },
      aspectRatio:    1.0,
      rememberLastUsedCamera: true,
      // iOS Safari needs exact environment facingMode
      videoConstraints: {
        facingMode: { exact: 'environment' }
      }
    };

    html5QrCode = new Html5Qrcode('qr-reader', { verbose: false });

    html5QrCode.start(
      { facingMode: { exact: 'environment' } },
      config,
      onQRSuccess,
      () => {} // suppress per-frame errors
    ).catch(() => {
      // Fallback: try without exact constraint (front camera devices)
      html5QrCode.start(
        { facingMode: 'environment' },
        config,
        onQRSuccess,
        () => {}
      ).catch(err => {
        console.error('Camera failed:', err);
        document.getElementById('qr-reader').innerHTML =
          '<div style="color:#888;font-size:0.85rem;padding:40px;text-align:center;">📷 Camera access denied.<br>Please allow camera permission and reload.<br><br>ကင်မရာ ခွင့်ပြုချက် ပေးပါ</div>';
      });
    });
  }

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().catch(() => {});
      html5QrCode = null;
    }
  }

  async function onQRSuccess(decodedText) {
    if (processing) return;
    processing = true;

    // Pause scanner while processing
    if (html5QrCode) html5QrCode.pause(true);

    loadingOverlay.classList.add('show');

    try {
      const res  = await fetch(WORKER_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ qrData: decodedText, pin: staffPin })
      });
      const data = await res.json();
      loadingOverlay.classList.remove('show');

      if (data.result === 'invalid_pin') {
        showPin('Wrong PIN. Please try again. / PIN မှားသည်။');
        return;
      }

      showResult(data);
    } catch (err) {
      loadingOverlay.classList.remove('show');
      showResult({ success: false, result: 'error', message: 'Network error. Check connection.' });
    }
  }

  // ── RESULT ────────────────────────────────────────────────────
  function showResult(data) {
    const { success, result, message, name, seat } = data;

    resultOverlay.className = '';

    if (success && result === 'valid') {
      resultOverlay.classList.add('show', 'valid');
      rIcon.textContent   = '✅';
      rStatus.textContent = 'ENTRY APPROVED';
      rStatus.style.color = '#4ade80';
      rName.textContent   = name || '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'Welcome! Enjoy the show.';
      rMy.textContent     = 'ကြိုဆိုပါသည်။ ပွဲကြည့်နိုင်ပါသည်။';
      rBtn.className      = 'result-btn btn-green';

    } else if (result === 'already_checked_in') {
      resultOverlay.classList.add('show', 'invalid');
      rIcon.textContent   = '🚫';
      rStatus.textContent = 'ALREADY USED';
      rStatus.style.color = '#f87171';
      rName.textContent   = name || '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'This ticket has already been scanned. Entry denied.';
      rMy.textContent     = 'ဤ ticket ကို အသုံးပြုပြီးပါပြီ။ ဝင်ခွင့် မပြုပါ။';
      rBtn.className      = 'result-btn btn-red';

    } else if (result === 'not_paid') {
      resultOverlay.classList.add('show', 'invalid');
      rIcon.textContent   = '💳';
      rStatus.textContent = 'NOT PAID';
      rStatus.style.color = '#f87171';
      rName.textContent   = name || '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'Payment not completed. Entry denied.';
      rMy.textContent     = 'ငွေပေးချေမှု မပြီးသေးပါ။ ဝင်ခွင့် မပြုပါ။';
      rBtn.className      = 'result-btn btn-red';

    } else if (result === 'not_found' || result === 'invalid_qr') {
      resultOverlay.classList.add('show', 'invalid');
      rIcon.textContent   = '❌';
      rStatus.textContent = 'INVALID TICKET';
      rStatus.style.color = '#f87171';
      rName.textContent   = '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'Ticket not found. Check with organiser.';
      rMy.textContent     = 'Ticket မရှိပါ။ စီစဉ်သူနှင့် ဆက်သွယ်ပါ။';
      rBtn.className      = 'result-btn btn-red';

    } else {
      resultOverlay.classList.add('show', 'warning');
      rIcon.textContent   = '⚠️';
      rStatus.textContent = 'ERROR';
      rStatus.style.color = '#fbbf24';
      rName.textContent   = '';
      rSeat.textContent   = '';
      rMsg.textContent    = message || 'Something went wrong. Try again.';
      rMy.textContent     = 'ပြဿနာရှိသည်။ ထပ်မံကြိုးစားပါ။';
      rBtn.className      = 'result-btn btn-yellow';
    }

    // Auto-dismiss after 5s
    let secs = 5;
    rTimer.textContent = `Auto-close in ${secs}s`;
    clearInterval(countdown);
    countdown = setInterval(() => {
      secs--;
      rTimer.textContent = `Auto-close in ${secs}s`;
      if (secs <= 0) dismiss();
    }, 1000);
  }

  function dismiss() {
    clearInterval(countdown);
    resultOverlay.className = '';
    processing = false;
    // Resume scanner
    if (html5QrCode) {
      html5QrCode.resume();
    }
  }

  rBtn.addEventListener('click', dismiss);
  resultOverlay.addEventListener('click', e => { if (e.target === resultOverlay) dismiss(); });
</script>
</body>
</html>
