<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Door Scanner | Light & Shadow Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --gold:   #c9a227;
      --dark:   #0a0a0c;
      --dark2:  #111116;
      --dark3:  #1a1a1f;
      --text:   #f5f5f7;
      --muted:  #888;
      --green:  #1a472a;
      --green2: #2d6a4f;
      --red:    #7b1d1d;
      --red2:   #c0392b;
      --yellow: #7a5c00;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    /* ── SCREENS ─────────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.25s;
    }

    .screen.hidden { opacity: 0; pointer-events: none; }

    /* ── PIN SCREEN ──────────────────────────────────────── */
    #pinScreen {
      background: var(--dark);
      gap: 20px;
    }

    .brand {
      text-align: center;
      margin-bottom: 8px;
    }

    .brand-name {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    .pin-label {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
    }

    .pin-display {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      transition: background 0.15s;
    }

    .pin-dot.filled { background: var(--gold); }

    .pin-error {
      font-size: 0.8rem;
      color: var(--red2);
      text-align: center;
      min-height: 20px;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(4, 72px);
      gap: 12px;
    }

    .key {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 1.5px solid rgba(201,162,39,0.3);
      background: var(--dark3);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, border-color 0.1s;
      user-select: none;
    }

    .key:active { background: rgba(201,162,39,0.15); border-color: var(--gold); }

    .key.empty { background: transparent; border: none; cursor: default; }

    .key.del { font-size: 1rem; color: var(--muted); }

    .key.enter {
      background: var(--gold);
      border-color: var(--gold);
      color: #000;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.05em;
    }

    .key.enter:active { background: #a07d1a; }

    /* ── SCANNER SCREEN ──────────────────────────────────── */
    #scanScreen {
      background: var(--dark);
      padding: 0;
      justify-content: flex-start;
    }

    .scan-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--dark2);
      border-bottom: 1px solid rgba(201,162,39,0.2);
      flex-shrink: 0;
    }

    .scan-title {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: bold;
    }

    .logout-btn {
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    .camera-wrap {
      width: 100%;
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #videoEl {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Scan frame overlay */
    .scan-frame {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .frame-box {
      width: min(260px, 65vw);
      height: min(260px, 65vw);
      position: relative;
    }

    .frame-box::before,
    .frame-box::after,
    .frame-corner-br,
    .frame-corner-bl {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border-color: var(--gold);
      border-style: solid;
    }

    .frame-box::before  { top: 0; left: 0;  border-width: 3px 0 0 3px; }
    .frame-box::after   { top: 0; right: 0; border-width: 3px 3px 0 0; }
    .frame-corner-br    { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
    .frame-corner-bl    { bottom: 0; left: 0;  border-width: 0 0 3px 3px; }

    .scan-line {
      position: absolute;
      left: 10px;
      right: 10px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: scanline 2s ease-in-out infinite;
    }

    @keyframes scanline {
      0%   { top: 10px; opacity: 1; }
      50%  { top: calc(100% - 10px); opacity: 1; }
      100% { top: 10px; opacity: 1; }
    }

    .scan-hint {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.05em;
    }

    /* ── RESULT OVERLAY ──────────────────────────────────── */
    #resultOverlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #resultOverlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #resultOverlay.valid   { background: rgba(10, 40, 20, 0.97); }
    #resultOverlay.invalid { background: rgba(40, 10, 10, 0.97); }
    #resultOverlay.warning { background: rgba(40, 35, 5, 0.97); }

    .result-icon {
      font-size: 5rem;
      margin-bottom: 16px;
      line-height: 1;
    }

    .result-status {
      font-size: 1.6rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-align: center;
    }

    .result-overlay.valid   .result-status { color: #4ade80; }
    .result-overlay.invalid .result-status { color: #f87171; }

    .result-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text);
      text-align: center;
      margin-bottom: 4px;
    }

    .result-seat {
      font-size: 2rem;
      font-weight: bold;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .result-message {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .result-burmese {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .result-timer {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.05em;
    }

    .result-tap {
      margin-top: 24px;
      padding: 14px 40px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
    }

    .result-tap.valid-btn   { background: #4ade80; color: #000; }
    .result-tap.invalid-btn { background: #f87171; color: #000; }
    .result-tap.warning-btn { background: var(--gold); color: #000; }

    /* ── LOADING SPINNER ─────────────────────────────────── */
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(201,162,39,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 99;
      background: rgba(10,10,12,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    #loadingOverlay.visible { opacity: 1; pointer-events: all; }
    #loadingOverlay p { font-size: 0.85rem; color: var(--muted); }

    /* ── CAMERA ERROR ────────────────────────────────────── */
    .camera-error {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 32px;
      text-align: center;
    }

    .camera-error.visible { display: flex; }
    .camera-error p { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
  </style>
</head>
<body>

<!-- ── PIN SCREEN ──────────────────────────────────────────────── -->
<div class="screen" id="pinScreen">
  <div class="brand">
    <div class="brand-name">Light & Shadow Media</div>
    <div class="brand-sub">Door Scanner</div>
  </div>

  <div class="pin-label">Enter Staff PIN</div>
  <div class="pin-display" id="pinDisplay">
    <div class="pin-dot" id="dot0"></div>
    <div class="pin-dot" id="dot1"></div>
    <div class="pin-dot" id="dot2"></div>
    <div class="pin-dot" id="dot3"></div>
  </div>
  <div class="pin-error" id="pinError"></div>

  <div class="keypad">
    <button class="key" data-key="1">1</button>
    <button class="key" data-key="2">2</button>
    <button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button>
    <button class="key" data-key="5">5</button>
    <button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button>
    <button class="key" data-key="8">8</button>
    <button class="key" data-key="9">9</button>
    <button class="key empty"></button>
    <button class="key" data-key="0">0</button>
    <button class="key del" id="delKey">⌫</button>
  </div>

  <div style="font-size:0.72rem;color:var(--muted);text-align:center;margin-top:8px;">
    ဝင်ရောက်ရန် Staff PIN ထည့်ပေးပါ
  </div>
</div>


<!-- ── SCANNER SCREEN ──────────────────────────────────────────── -->
<div class="screen hidden" id="scanScreen">
  <div class="scan-header">
    <div class="scan-title">🎬 Door Scanner</div>
    <button class="logout-btn" id="logoutBtn">Lock</button>
  </div>

  <div class="camera-wrap">
    <video id="videoEl" autoplay playsinline muted></video>

    <div class="scan-frame">
      <div class="frame-box">
        <div class="frame-corner-br"></div>
        <div class="frame-corner-bl"></div>
        <div class="scan-line"></div>
      </div>
    </div>

    <div class="scan-hint">Point camera at the QR code on the ticket</div>

    <div class="camera-error" id="cameraError">
      <div style="font-size:2rem">📷</div>
      <p>Camera access denied or not available.<br>Please allow camera permission and reload the page.</p>
      <p style="color:rgba(201,162,39,0.7);">ကင်မရာ ခွင့်ပြုချက် ပေးပါ</p>
    </div>
  </div>
</div>


<!-- ── LOADING OVERLAY ─────────────────────────────────────────── -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p>Verifying ticket…</p>
</div>


<!-- ── RESULT OVERLAY ──────────────────────────────────────────── -->
<div id="resultOverlay">
  <div class="result-icon" id="resultIcon"></div>
  <div class="result-status" id="resultStatus"></div>
  <div class="result-name"  id="resultName"></div>
  <div class="result-seat"  id="resultSeat"></div>
  <div class="result-message"  id="resultMessage"></div>
  <div class="result-burmese"  id="resultBurmese"></div>
  <div class="result-timer"    id="resultTimer"></div>
  <button class="result-tap" id="resultTapBtn">Scan Next</button>
</div>


<!-- ── JSQR library (open source, no key needed) ──────────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>

<script>
  const WORKER_URL = 'https://lsm-bookings.lightandshadowmdeiasg.workers.dev/scan';
  const PIN_LENGTH = 4;

  // ── State ─────────────────────────────────────────────────────
  let staffPin      = '';
  let enteredPin    = '';
  let scanning      = false;
  let lastScanned   = '';
  let scanCooldown  = false;
  let resultTimer   = null;
  let videoStream   = null;
  let animFrame     = null;

  // ── Elements ──────────────────────────────────────────────────
  const pinScreen      = document.getElementById('pinScreen');
  const scanScreen     = document.getElementById('scanScreen');
  const pinError       = document.getElementById('pinError');
  const videoEl        = document.getElementById('videoEl');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const resultOverlay  = document.getElementById('resultOverlay');
  const resultIcon     = document.getElementById('resultIcon');
  const resultStatus   = document.getElementById('resultStatus');
  const resultName     = document.getElementById('resultName');
  const resultSeat     = document.getElementById('resultSeat');
  const resultMessage  = document.getElementById('resultMessage');
  const resultBurmese  = document.getElementById('resultBurmese');
  const resultTimerEl  = document.getElementById('resultTimer');
  const resultTapBtn   = document.getElementById('resultTapBtn');
  const cameraError    = document.getElementById('cameraError');
  const logoutBtn      = document.getElementById('logoutBtn');
  const canvas         = document.createElement('canvas');
  const ctx            = canvas.getContext('2d', { willReadFrequently: true });

  // ── PIN KEYPAD ────────────────────────────────────────────────
  document.querySelectorAll('.key[data-key]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (enteredPin.length >= PIN_LENGTH) return;
      enteredPin += btn.dataset.key;
      updateDots();
      if (enteredPin.length === PIN_LENGTH) setTimeout(submitPin, 200);
    });
  });

  document.getElementById('delKey').addEventListener('click', () => {
    enteredPin = enteredPin.slice(0, -1);
    updateDots();
    pinError.textContent = '';
  });

  function updateDots() {
    for (let i = 0; i < PIN_LENGTH; i++) {
      document.getElementById(`dot${i}`).classList.toggle('filled', i < enteredPin.length);
    }
  }

  async function submitPin() {
    // We verify the PIN server-side on the first scan
    // For UX, just accept any 4-digit PIN here and validate on scan
    staffPin = enteredPin;
    enteredPin = '';
    updateDots();
    pinError.textContent = '';
    showScanScreen();
  }

  // ── SCREENS ───────────────────────────────────────────────────
  function showScanScreen() {
    pinScreen.classList.add('hidden');
    scanScreen.classList.remove('hidden');
    startCamera();
  }

  function showPinScreen() {
    scanScreen.classList.add('hidden');
    pinScreen.classList.remove('hidden');
    stopCamera();
    staffPin   = '';
    enteredPin = '';
    updateDots();
    pinError.textContent = '';
  }

  logoutBtn.addEventListener('click', showPinScreen);

  // ── CAMERA ────────────────────────────────────────────────────
  async function startCamera() {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      videoEl.srcObject = videoStream;
      videoEl.play();
      scanning = true;
      requestAnimationFrame(scanFrame);
    } catch (err) {
      console.error('Camera error:', err);
      cameraError.classList.add('visible');
    }
  }

  function stopCamera() {
    scanning = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    if (videoStream) {
      videoStream.getTracks().forEach(t => t.stop());
      videoStream = null;
    }
  }

  // ── QR SCANNING LOOP ─────────────────────────────────────────
  function scanFrame() {
    if (!scanning) return;
    animFrame = requestAnimationFrame(scanFrame);

    if (scanCooldown || videoEl.readyState < 2) return;
    if (videoEl.videoWidth === 0) return;

    canvas.width  = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;
    ctx.drawImage(videoEl, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code      = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });

    if (code && code.data && code.data !== lastScanned) {
      lastScanned  = code.data;
      scanCooldown = true;
      processQR(code.data);
    }
  }

  // ── PROCESS QR ────────────────────────────────────────────────
  async function processQR(qrData) {
    showLoading(true);

    try {
      const res  = await fetch(WORKER_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ qrData, pin: staffPin })
      });
      const data = await res.json();

      showLoading(false);

      if (data.result === 'invalid_pin') {
        // Wrong PIN — kick back to PIN screen
        showPinScreen();
        setTimeout(() => { pinError.textContent = 'Wrong PIN. Please try again.'; }, 300);
        return;
      }

      showResult(data);
    } catch (err) {
      showLoading(false);
      showResult({
        success: false,
        result:  'error',
        message: 'Network error. Check connection.',
        seat:    '',
        name:    ''
      });
    }
  }

  // ── SHOW RESULT ───────────────────────────────────────────────
  function showResult(data) {
    const { success, result, message, name, seat, checkedInAt } = data;

    resultOverlay.className = '';
    resultTapBtn.className  = 'result-tap';

    if (success && result === 'valid') {
      resultOverlay.classList.add('valid');
      resultTapBtn.classList.add('valid-btn');
      resultIcon.textContent    = '✅';
      resultStatus.textContent  = 'ENTRY APPROVED';
      resultStatus.style.color  = '#4ade80';
      resultName.textContent    = name || '';
      resultSeat.textContent    = seat ? `Seat ${seat}` : '';
      resultMessage.textContent = 'Welcome! Enjoy the show.';
      resultBurmese.textContent = 'ကြိုဆိုပါသည်။ ပွဲကြည့်နိုင်ပါသည်။';

    } else if (result === 'already_checked_in') {
      resultOverlay.classList.add('invalid');
      resultTapBtn.classList.add('invalid-btn');
      resultIcon.textContent    = '🚫';
      resultStatus.textContent  = 'ALREADY USED';
      resultStatus.style.color  = '#f87171';
      resultName.textContent    = name || '';
      resultSeat.textContent    = seat ? `Seat ${seat}` : '';
      resultMessage.textContent = 'This ticket has already been scanned. Entry denied.';
      resultBurmese.textContent = 'ဤ ticket ကို အသုံးပြုပြီးပါပြီ။ ဝင်ခွင့် မပြုပါ။';

    } else if (result === 'not_paid') {
      resultOverlay.classList.add('invalid');
      resultTapBtn.classList.add('invalid-btn');
      resultIcon.textContent    = '💳';
      resultStatus.textContent  = 'NOT PAID';
      resultStatus.style.color  = '#f87171';
      resultName.textContent    = name || '';
      resultSeat.textContent    = seat ? `Seat ${seat}` : '';
      resultMessage.textContent = 'Payment not completed. Entry denied.';
      resultBurmese.textContent = 'ငွေပေးချေမှု မပြီးသေးပါ။ ဝင်ခွင့် မပြုပါ။';

    } else if (result === 'not_found' || result === 'invalid_qr') {
      resultOverlay.classList.add('invalid');
      resultTapBtn.classList.add('invalid-btn');
      resultIcon.textContent    = '❌';
      resultStatus.textContent  = 'INVALID TICKET';
      resultStatus.style.color  = '#f87171';
      resultName.textContent    = '';
      resultSeat.textContent    = seat ? `Seat ${seat}` : '';
      resultMessage.textContent = message || 'Ticket not found. Please check with organiser.';
      resultBurmese.textContent = 'Ticket မရှိပါ။ စီစဉ်သူနှင့် ဆက်သွယ်ပါ။';

    } else {
      resultOverlay.classList.add('invalid');
      resultTapBtn.classList.add('invalid-btn');
      resultIcon.textContent    = '⚠️';
      resultStatus.textContent  = 'ERROR';
      resultStatus.style.color  = '#fbbf24';
      resultName.textContent    = '';
      resultSeat.textContent    = '';
      resultMessage.textContent = message || 'Something went wrong. Try again.';
      resultBurmese.textContent = 'ပြဿနာရှိသည်။ ထပ်မံကြိုးစားပါ။';
    }

    // Auto-dismiss timer
    let countdown = 5;
    resultTimerEl.textContent = `Auto-close in ${countdown}s`;
    resultOverlay.classList.add('visible');

    resultTimer = setInterval(() => {
      countdown--;
      resultTimerEl.textContent = `Auto-close in ${countdown}s`;
      if (countdown <= 0) dismissResult();
    }, 1000);
  }

  function dismissResult() {
    clearInterval(resultTimer);
    resultOverlay.classList.remove('visible');
    setTimeout(() => {
      lastScanned  = '';
      scanCooldown = false;
    }, 500);
  }

  resultTapBtn.addEventListener('click', dismissResult);
  resultOverlay.addEventListener('click', (e) => {
    if (e.target === resultOverlay) dismissResult();
  });

  // ── LOADING ───────────────────────────────────────────────────
  function showLoading(show) {
    loadingOverlay.classList.toggle('visible', show);
  }
</script>
</body>
</html>
