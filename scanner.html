<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Door Scanner | Light & Shadow Media</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --gold:  #c9a227;
      --dark:  #0a0a0c;
      --dark2: #111116;
      --dark3: #1a1a1f;
      --text:  #f5f5f7;
      --muted: #888888;
    }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    /* ── SCREENS ──────────────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .screen.hidden { display: none; }

    /* ── PIN SCREEN ───────────────────────────────────── */
    #pinScreen {
      background: var(--dark);
      gap: 20px;
      padding: 32px 24px;
    }

    .brand-name {
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .pin-label {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      text-align: center;
    }
    .pin-display {
      display: flex;
      gap: 14px;
      justify-content: center;
    }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      transition: background 0.15s;
    }
    .pin-dot.filled { background: var(--gold); }
    .pin-error {
      font-size: 0.82rem;
      color: #f87171;
      text-align: center;
      min-height: 20px;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(4, 72px);
      gap: 12px;
    }
    .key {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 1.5px solid rgba(201,162,39,0.3);
      background: var(--dark3);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-appearance: none;
      transition: background 0.1s;
    }
    .key:active { background: rgba(201,162,39,0.2); }
    .key.empty  { background: transparent; border: none; pointer-events: none; }
    .key.del    { font-size: 1rem; color: var(--muted); }

    /* ── SCANNER SCREEN ───────────────────────────────── */
    #scanScreen {
      background: #000;
      justify-content: flex-start;
      padding: 0;
    }

    .scan-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10,10,12,0.85);
      border-bottom: 1px solid rgba(201,162,39,0.2);
      position: absolute;
      top: 0;
      z-index: 10;
    }
    .scan-title {
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: bold;
    }
    .lock-btn {
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      -webkit-appearance: none;
    }

    /* Live video fills full screen */
    #videoEl {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Scan frame overlay */
    .scan-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .frame {
      width: min(260px, 65vw);
      height: min(260px, 65vw);
      position: relative;
    }

    /* Corner brackets */
    .frame::before, .frame::after,
    .c-br, .c-bl {
      content: '';
      position: absolute;
      width: 36px;
      height: 36px;
      border-color: var(--gold);
      border-style: solid;
    }
    .frame::before { top: 0;    left: 0;  border-width: 3px 0 0 3px; }
    .frame::after  { top: 0;    right: 0; border-width: 3px 3px 0 0; }
    .c-br          { bottom: 0; right: 0; border-width: 0 3px 3px 0; }
    .c-bl          { bottom: 0; left: 0;  border-width: 0 0 3px 3px; }

    /* Animated scan line */
    .scan-line {
      position: absolute;
      left: 8px; right: 8px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      animation: scanline 2s ease-in-out infinite;
    }
    @keyframes scanline {
      0%   { top: 8px; }
      50%  { top: calc(100% - 8px); }
      100% { top: 8px; }
    }

    .scan-hint {
      position: absolute;
      bottom: 40px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      padding: 0 24px;
    }

    /* Camera permission error */
    #camError {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      padding: 40px;
      text-align: center;
      background: var(--dark);
    }
    #camError.show { display: flex; }
    #camError p { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

    /* ── RESULT OVERLAY ───────────────────────────────── */
    #resultOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    #resultOverlay.show    { display: flex; }
    #resultOverlay.valid   { background: rgba(10,40,20,0.98); }
    #resultOverlay.invalid { background: rgba(40,10,10,0.98); }
    #resultOverlay.warning { background: rgba(40,35,5,0.98); }

    .r-icon   { font-size: 5rem; line-height: 1; margin-bottom: 12px; }
    .r-status { font-size: 1.5rem; font-weight: bold; letter-spacing: 0.05em; margin-bottom: 8px; }
    .r-name   { font-size: 1.1rem; font-weight: bold; margin-bottom: 4px; }
    .r-seat   { font-size: 2rem; font-weight: bold; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 16px; }
    .r-msg    { font-size: 0.9rem; color: rgba(255,255,255,0.7); max-width: 280px; line-height: 1.5; margin-bottom: 6px; }
    .r-my     { font-size: 0.85rem; color: rgba(255,255,255,0.45); max-width: 280px; line-height: 1.6; margin-bottom: 20px; }
    .r-timer  { font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-bottom: 20px; }
    .r-btn {
      padding: 16px 52px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      cursor: pointer;
      border: none;
      -webkit-appearance: none;
    }
    .r-btn.green  { background: #4ade80; color: #000; }
    .r-btn.red    { background: #f87171; color: #000; }
    .r-btn.yellow { background: var(--gold); color: #000; }

    /* ── LOADING ──────────────────────────────────────── */
    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(10,10,12,0.88);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    #loadingOverlay.show { display: flex; }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(201,162,39,0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- PIN SCREEN -->
<div class="screen" id="pinScreen">
  <div>
    <div class="brand-name">Light &amp; Shadow Media</div>
    <div class="brand-sub">Door Scanner — ဝင်ပေါက် စစ်ဆေးရေး</div>
  </div>

  <div class="pin-label">Staff PIN ထည့်ပါ</div>

  <div class="pin-display">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>

  <div class="pin-error" id="pinErr"></div>

  <div class="keypad">
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key empty"></button>
    <button class="key" data-k="0">0</button>
    <button class="key del" id="delBtn">⌫</button>
  </div>
</div>


<!-- SCANNER SCREEN -->
<div class="screen hidden" id="scanScreen">
  <video id="videoEl" autoplay playsinline muted></video>

  <div class="scan-header">
    <div class="scan-title">🎬 Scan Ticket</div>
    <button class="lock-btn" id="lockBtn">Lock</button>
  </div>

  <div class="scan-overlay">
    <div class="frame">
      <div class="c-br"></div>
      <div class="c-bl"></div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-hint">
      Point at QR code &nbsp;|&nbsp; QR Code ကို ရိုက်ပါ
    </div>
  </div>

  <div id="camError">
    <div style="font-size:2.5rem">📷</div>
    <p>Camera access denied.<br>Allow camera permission in Safari Settings and reload.</p>
    <p style="color:rgba(201,162,39,0.7);margin-top:8px;">Safari Settings တွင် ကင်မရာ ခွင့်ပြုပြီး reload လုပ်ပါ</p>
  </div>

  <!-- Hidden canvas for jsQR fallback -->
  <canvas id="cvs" style="display:none;"></canvas>
</div>


<!-- LOADING -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:0.85rem;">Verifying ticket…</p>
</div>


<!-- RESULT -->
<div id="resultOverlay">
  <div class="r-icon"   id="rIcon"></div>
  <div class="r-status" id="rStatus"></div>
  <div class="r-name"   id="rName"></div>
  <div class="r-seat"   id="rSeat"></div>
  <div class="r-msg"    id="rMsg"></div>
  <div class="r-my"     id="rMy"></div>
  <div class="r-timer"  id="rTimer"></div>
  <button class="r-btn" id="rBtn">Scan Next / နောက်တစ်ဦး</button>
</div>


<!-- jsQR fallback for non-BarcodeDetector browsers -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
  const WORKER_URL = 'https://lsm-bookings.lightandshadowmdeiasg.workers.dev/scan';
  const PIN_LEN    = 4;
  const COOLDOWN   = 3000; // ms between scans

  let staffPin    = '';
  let pin         = '';
  let busy        = false;
  let lastScanned = '';
  let stream      = null;
  let detector    = null;
  let rafId       = null;
  let countdownId = null;
  let useDetector = false;

  // Elements
  const pinScreen      = document.getElementById('pinScreen');
  const scanScreen     = document.getElementById('scanScreen');
  const pinErr         = document.getElementById('pinErr');
  const videoEl        = document.getElementById('videoEl');
  const cvs            = document.getElementById('cvs');
  const ctx            = cvs.getContext('2d', { willReadFrequently: true });
  const camError       = document.getElementById('camError');
  const loadingOverlay = document.getElementById('loadingOverlay');
  const resultOverlay  = document.getElementById('resultOverlay');
  const rIcon          = document.getElementById('rIcon');
  const rStatus        = document.getElementById('rStatus');
  const rName          = document.getElementById('rName');
  const rSeat          = document.getElementById('rSeat');
  const rMsg           = document.getElementById('rMsg');
  const rMy            = document.getElementById('rMy');
  const rTimer         = document.getElementById('rTimer');
  const rBtn           = document.getElementById('rBtn');

  // ── PIN ─────────────────────────────────────────────
  document.querySelectorAll('.key[data-k]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pin.length >= PIN_LEN) return;
      pin += btn.dataset.k;
      updateDots();
      if (pin.length === PIN_LEN) setTimeout(onPinDone, 200);
    });
  });

  document.getElementById('delBtn').addEventListener('click', () => {
    pin = pin.slice(0, -1);
    updateDots();
    pinErr.textContent = '';
  });

  function updateDots() {
    for (let i = 0; i < PIN_LEN; i++) {
      document.getElementById(`d${i}`).classList.toggle('filled', i < pin.length);
    }
  }

  function onPinDone() {
    staffPin = pin;
    pin = '';
    updateDots();
    pinErr.textContent = '';
    pinScreen.classList.add('hidden');
    scanScreen.classList.remove('hidden');
    startCamera();
  }

  document.getElementById('lockBtn').addEventListener('click', lock);

  function lock() {
    stopCamera();
    scanScreen.classList.add('hidden');
    pinScreen.classList.remove('hidden');
    staffPin = '';
    pin = '';
    updateDots();
    pinErr.textContent = '';
  }

  // ── CAMERA ──────────────────────────────────────────
  async function startCamera() {
    // Use BarcodeDetector if available (iOS 17+, Chrome)
    if ('BarcodeDetector' in window) {
      try {
        const supported = await BarcodeDetector.getSupportedFormats();
        if (supported.includes('qr_code')) {
          detector    = new BarcodeDetector({ formats: ['qr_code'] });
          useDetector = true;
        }
      } catch (e) {
        useDetector = false;
      }
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { exact: 'environment' },
          width:      { ideal: 1280 },
          height:     { ideal: 720 }
        }
      });
    } catch {
      // Fallback without exact constraint
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
      } catch (err) {
        camError.classList.add('show');
        return;
      }
    }

    videoEl.srcObject = stream;
    await videoEl.play();
    rafId = requestAnimationFrame(scanLoop);
  }

  function stopCamera() {
    if (rafId)  { cancelAnimationFrame(rafId); rafId = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    videoEl.srcObject = null;
  }

  // ── SCAN LOOP ────────────────────────────────────────
  async function scanLoop() {
    rafId = requestAnimationFrame(scanLoop);

    if (busy || videoEl.readyState < 2 || videoEl.videoWidth === 0) return;

    let qrText = null;

    if (useDetector && detector) {
      // BarcodeDetector path — native, fast, works on iOS 17+
      try {
        const codes = await detector.detect(videoEl);
        if (codes.length > 0) qrText = codes[0].rawValue;
      } catch { /* ignore per-frame errors */ }
    } else {
      // jsQR fallback — canvas-based
      cvs.width  = videoEl.videoWidth;
      cvs.height = videoEl.videoHeight;
      ctx.drawImage(videoEl, 0, 0);
      const img  = ctx.getImageData(0, 0, cvs.width, cvs.height);
      const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
      if (code) qrText = code.data;
    }

    if (qrText && qrText !== lastScanned) {
      lastScanned = qrText;
      busy        = true;
      await processQR(qrText);
    }
  }

  // ── VERIFY ────────────────────────────────────────────
  async function processQR(qrText) {
    loadingOverlay.classList.add('show');
    try {
      const res  = await fetch(WORKER_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ qrData: qrText, pin: staffPin })
      });
      const data = await res.json();
      loadingOverlay.classList.remove('show');

      if (data.result === 'invalid_pin') {
        lock();
        setTimeout(() => { pinErr.textContent = 'Wrong PIN. Try again. / PIN မှားသည်။'; }, 300);
        return;
      }

      showResult(data);
    } catch {
      loadingOverlay.classList.remove('show');
      showResult({ success: false, result: 'error', message: 'Network error. Check WiFi.' });
    }
  }

  // ── RESULT ────────────────────────────────────────────
  function showResult(data) {
    const { success, result, message, name, seat } = data;
    resultOverlay.className = 'show';

    if (success && result === 'valid') {
      resultOverlay.classList.add('valid');
      rIcon.textContent   = '✅';
      rStatus.textContent = 'ENTRY APPROVED';
      rStatus.style.color = '#4ade80';
      rName.textContent   = name || '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'Welcome! Enjoy the show.';
      rMy.textContent     = 'ကြိုဆိုပါသည်။ ပွဲကြည့်နိုင်ပါသည်။';
      rBtn.className      = 'r-btn green';

    } else if (result === 'already_checked_in') {
      resultOverlay.classList.add('invalid');
      rIcon.textContent   = '🚫';
      rStatus.textContent = 'ALREADY USED';
      rStatus.style.color = '#f87171';
      rName.textContent   = name || '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'This ticket has already been scanned. Entry denied.';
      rMy.textContent     = 'ဤ ticket ကို အသုံးပြုပြီးပါပြီ။ ဝင်ခွင့် မပြုပါ။';
      rBtn.className      = 'r-btn red';

    } else if (result === 'not_paid') {
      resultOverlay.classList.add('invalid');
      rIcon.textContent   = '💳';
      rStatus.textContent = 'NOT PAID';
      rStatus.style.color = '#f87171';
      rName.textContent   = name || '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'Payment not completed. Entry denied.';
      rMy.textContent     = 'ငွေပေးချေမှု မပြီးသေးပါ။ ဝင်ခွင့် မပြုပါ။';
      rBtn.className      = 'r-btn red';

    } else if (result === 'not_found' || result === 'invalid_qr') {
      resultOverlay.classList.add('invalid');
      rIcon.textContent   = '❌';
      rStatus.textContent = 'INVALID TICKET';
      rStatus.style.color = '#f87171';
      rName.textContent   = '';
      rSeat.textContent   = seat ? `Seat ${seat}` : '';
      rMsg.textContent    = 'Ticket not found. Check with organiser.';
      rMy.textContent     = 'Ticket မရှိပါ။ စီစဉ်သူနှင့် ဆက်သွယ်ပါ။';
      rBtn.className      = 'r-btn red';

    } else {
      resultOverlay.classList.add('warning');
      rIcon.textContent   = '⚠️';
      rStatus.textContent = 'ERROR';
      rStatus.style.color = '#fbbf24';
      rName.textContent   = '';
      rSeat.textContent   = '';
      rMsg.textContent    = message || 'Something went wrong. Try again.';
      rMy.textContent     = 'ပြဿနာရှိသည်။ ထပ်မံကြိုးစားပါ။';
      rBtn.className      = 'r-btn yellow';
    }

    // Auto-dismiss after 5s
    let secs = 5;
    rTimer.textContent = `Auto-close in ${secs}s`;
    clearInterval(countdownId);
    countdownId = setInterval(() => {
      secs--;
      rTimer.textContent = `Auto-close in ${secs}s`;
      if (secs <= 0) dismiss();
    }, 1000);
  }

  function dismiss() {
    clearInterval(countdownId);
    resultOverlay.className = '';
    // Reset after cooldown so same QR isn't re-triggered immediately
    setTimeout(() => {
      lastScanned = '';
      busy        = false;
    }, COOLDOWN);
  }

  rBtn.addEventListener('click', dismiss);
  resultOverlay.addEventListener('click', e => { if (e.target === resultOverlay) dismiss(); });
</script>
</body>
</html>
